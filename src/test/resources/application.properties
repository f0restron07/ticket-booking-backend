spring.application.name=ticketbooking

# In-memory H2 (PostgreSQL compatibility mode) for tests
spring.datasource.url=jdbc:h2:mem:ticketbooking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate manage the schema in tests; Flyway targets Postgres only
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
