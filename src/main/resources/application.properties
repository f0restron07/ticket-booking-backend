spring.application.name=ticketbooking
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketbooking
spring.datasource.username=omkar
spring.datasource.password=omkar
# PostgreSQL datasource (override via environment variables)

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Flyway owns the schema, so just validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations (place SQL under src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
